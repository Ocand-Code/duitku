name: Build Android App Bundle

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.27.1
      - name: Generate Android scaffold
        run: flutter create . --platforms=android --org=com.duitku --project-name=duitku
      - name: Upgrade Gradle wrapper
        run: sed -i 's|gradle-8.[0-9.]*-all|gradle-8.14-all|g; s|gradle-8.[0-9.]*-bin|gradle-8.14-bin|g' android/gradle/wrapper/gradle-wrapper.properties
      - name: Decode keystore
        run: echo "$KEYSTORE_B64" | base64 -d > keystore.jks
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      - name: Patch signing config
        run: cp .github/app-build.gradle.template android/app/build.gradle
      - name: Get dependencies
        run: flutter pub get
      - name: Build App Bundle
        run: flutter build appbundle --release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/bundle/release/app-release.aab
